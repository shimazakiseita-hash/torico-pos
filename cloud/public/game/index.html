<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1f5c">
<title>ミニゲーム｜やきとり TORI♡CO</title>
<link rel="icon" href="/brand/mascot.webp">
<link rel="stylesheet" href="/game/style.css">
<script type="module" src="/game/app.js"></script>
</head>
<body>
<main id="hub" class="view" hidden>
  <header class="top">
    <a class="back" href="/">← 呼び出し状況</a>
    <span class="logo"><img src="/brand/logo.webp" alt="やきとり TORI♡CO" width="480" height="477"></span>
  </header>
  <section class="card me">
    <canvas id="me" width="160" height="160" aria-hidden="true"></canvas>
    <div>
      <p class="label">やきとりポイント</p>
      <p id="points" class="points"></p>
      <p id="next-costume" class="small"></p>
      <button id="open-dress" class="btn ghost" type="button">きせかえ</button>
    </div>
  </section>
  <h1 class="title">ミニゲーム</h1>
  <ul id="games" class="games"></ul>
  <p class="small center">あそぶほど やきとりポイントが たまって、きせかえが ふえるよ</p>
</main>

<main id="dress" class="view" hidden>
  <header class="top"><button class="back" type="button" data-go="hub">← もどる</button></header>
  <h1 class="title">きせかえ</h1>
  <p id="dress-points" class="center"></p>
  <ul id="costumes" class="costumes"></ul>
</main>

<main id="play" class="view play" hidden>
  <canvas id="stage" aria-label="ゲーム画面"></canvas>
  <div id="ready" class="overlay">
    <div class="card">
      <h2 id="ready-title"></h2>
      <p id="ready-howto"></p>
      <button id="start" class="btn pink" type="button">スタート</button>
      <button class="btn ghost" type="button" data-go="hub">やめる</button>
    </div>
  </div>
</main>

<main id="result" class="view" hidden>
  <section class="card center">
    <p id="result-game" class="label"></p>
    <p id="result-score" class="score"></p>
    <p id="result-best" class="best"></p>
    <p id="result-points" class="small"></p>
    <p id="result-unlock" class="unlock" hidden></p>
  </section>
  <section class="card">
    <h2>ランキングに のせる</h2>
    <form id="submit-form" class="row">
      <input id="name" maxlength="10" placeholder="なまえ（10もじまで）" autocomplete="nickname" enterkeyhint="send">
      <button class="btn pink" type="submit">のせる</button>
    </form>
    <p id="submit-msg" class="small" aria-live="polite"></p>
  </section>
  <section class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-board="today" aria-selected="true">今日</button>
      <button type="button" role="tab" data-board="all" aria-selected="false">歴代</button>
    </div>
    <ol id="ranking" class="ranking"></ol>
  </section>
  <div class="actions">
    <button id="again" class="btn pink" type="button">もういちど</button>
    <button class="btn ghost" type="button" data-go="hub">ゲームをえらぶ</button>
  </div>
</main>
</body>
</html>
