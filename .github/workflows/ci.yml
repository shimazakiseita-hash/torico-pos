name: 継続的インテグレーション

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: テスト・静的解析・ビルド
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - name: ルートの依存関係をインストール
        run: npm ci
      - name: リントを実行
        run: npm run lint
      - name: Next.jsの型を生成
        run: npx next typegen
      - name: ルートの型をチェック
        run: npx tsc --noEmit
      - name: テストを実行
        run: npm test
      - name: ビルドを実行
        run: npm run build
      - name: 公開ページの依存関係をインストール
        working-directory: cloud
        run: npm ci
      - name: 公開ページの型をチェック
        working-directory: cloud
        run: npx tsc --noEmit
